ll,{\"children\":\"웹 기술 기반으로 웹개발자 친화성\"}],\"\\n\",[\"$\",\"li\",null,{\"children\":\"네트워크 요청을 가로채고 필요한 리소스를 캐싱하여 오프라인 상태에서도 앱의 일부 기능을 제공할 수 있다.\"}],\"\\n\",[\"$\",\"li\",null,{\"children\":\"유연한 캐싱 전략 (Cache First, Network First 등)\"}],\"\\n\",[\"$\",\"li\",null,{\"children\":\"브라우저에서 제공하는 표준화된 API 및 인터페이스를 사용하므로 정제된 기능을 복잡한 구현 없이 사용할 수 있다.\\r\\n(네이티브 API도 Service worker에서 제공하는 기능을 사용할 수 있지만 구현이 복잡해질 수 있음.)\"}],\"\\n\"]}],\"\\n\",[\"$\",\"h3\",null,{\"children\":\"실제 업무에서의한계\"}],\"\\n\",[\"$\",\"h3\",null,{\"children\":\"1. iOS ATS 정책과 관련된 한계\"}],\"\\n\",[\"$\",\"h4\",null,{\"children\":\"용어 정리)\"}],\"\\n\",[\"$\",\"blockquote\",null,{\"children\":[\"\\n\",[\"$\",\"h4\",null,{\"children\":\"ATS (App Transport Security) -\"}],\"\\n\",[\"$\",\"p\",null,{\"children\":[\"애플리케이션과 웹 서비스 사이에 통신에서 보안 향상을 위해 iOS 9.0부터 도입된 보안 정책으로 \",[\"$\",\"br\",null,{}],\"\\r\\n보안이 취약한 네트워크를 차단하고 모든 인터넷 통신 시 안전한 프로토콜을 사용하는 것을 보장한다.\"]}],\"\\n\",[\"$\",\"ul\",null,{\"children\":[\"\\n\",[\"$\",\"li\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"HTTP 요청\"}],\"은 차단되고 네트워크 요청이 \",[\"$\",\"strong\",null,{\"children\":\"HTTPS\"}],\"를 통해 안전하게 전송되도록 요구한다.\"]}],\"\\n\",[\"$\",\"li\",null,{\"children\":\"특정 도메인에 대해 예외를 설정하려면 Info.plist 파일에 해당 도메인에 대한 허용 정책을 명시적으로 추가해야한다.\"}],\"\\n\"]}],\"\\n\"]}],\"\\n\",[\"$\",\"blockquote\",null,{\"children\":[\"\\n\",[\"$\",\"h4\",null,{\"children\":\"App Bound Domain -\"}],\"\\n\",[\"$\",\"p\",null,{\"children\":\"iOS의 WKWebView에서 Service Worker를 사용하려면 Apple이 추가로 요구하는 App Bound Domains 규칙을 따라야 한다.\"}],\"\\n\",[\"$\",\"ul\",null,{\"children\":[\"\\n\",[\"$\",\"li\",null,{\"children\":[\"App Bound Domains는 앱이 사용할 도메인을 \",[\"$\",\"strong\",null,{\"children\":\"명확히 정의\"}],\"하는 개념이다.\"]}],\"\\n\",[\"$\",\"li\",null,{\"children\":[\"WKWebView 내에서 Service Worker와 같은 고급 웹 기능 (ex. IndexedDB, WebRTC)을 사용하려면 앱의 Info.plist 파일에 해당 도메인들을 ** App Bound Domains 리스트**로 등록해야 한다. (\",[\"$\",\"strong\",null,{\"children\":\"네이티브 단의 역할\"}],\")\"]}],\"\\n\"]}],\"\\n\"]}],\"\\n\",[\"$\",\"hr\",null,{}],\"\\n\",[\"$\",\"p\",null,{\"children\":[\"-\u003e App Bound Domains 리스트가 \",[\"$\",\"strong\",null,{\"children\":\"10개를 초과\"}],\"하거나 동적으로 호출되는 외부 도메인(예측 불가능한 도메인)이 있는 경우 iOS에서 Service worker를 사용하는데 제약이 있다.\"]}],\"\\n\",[\"$\",\"hr\",null,{}],\"\\n\",[\"$\",\"h3\",null,{\"children\":\"2. 캐싱 전략에서의 문제점\"}],\"\\n\",[\"$\",\"h4\",null,{\"children\":\"용어 정리)\"}],\"\\n\",[\"$\",\"blockquote\",null,{\"children\":[\"\\n\",[\"$\",\"h4\",null,{\"children\":\"캐시 SWAP 과정\"}],\"\\n\",[\"$\",\"p\",null,{\"children\":\"새로운 리소스가 배포될 때 기존 캐시와 새로운 캐시를 교체(swap)하는 과정이다.\"}],\"\\n\"]}],\"\\n\",[\"$\",\"ol\",null,{\"children\":[\"\\n\",[\"$\",\"li\",null,{\"children\":[\"\\n\",[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Service Worker 업데이트 시점\"}],\" \",[\"$\",\"br\",null,{}],\"\\r\\n새로운 버전의 Service Worker가 배포되면 install 이벤트가 발생하여 새로운 리소스를 다운로드하고 캐시에 저장한다. \",[\"$\",\"br\",null,{}],\" (이 때 기존 리소스는 아직 active 상태의 이전 Service Worker가 관리하고 있다.)\"]}],\"\\n\"]}],\"\\n\",[\"$\",\"li\",null,{\"children\":[\"\\n\",[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"캐시 SWAP 타이밍\"}],\" \",[\"$\",\"br\",null,{}],\"\\r\\n새로운 Service Worker가 활성화(active 이벤트)되면, 이전 캐시를 삭제하고 새 캐시로 교체한다.\"]}],\"\\n\"]}],\"\\n\",[\"$\",\"li\",null,{\"children\":[\"\\n\",[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"캐싱 SWAP의 지연\"}],\" \",[\"$\",\"br\",null,{}],\"\\r\\nService Worker는 백그라운드에서 작동하므로 캐시 SWAP은 네트워크 상태와 디바이스 성능에 따라 몇 초 이상 걸릴 수 있다.\\r\\n이 지연 동안 사용자가 앱을 사용하는 경우 old 캐시와 new 캐시가 혼합되어 처리될 수 있다.\"]}],\"\\n\"]}],\"\\n\"]}],\"\\n\",[\"$\",\"hr\",null,{}],\"\\n\",[\"$\",\"p\",null,{\"children\":[\"-\u003e Service Worker에서 \",[\"$\",\"strong\",null,{\"children\":\"cache-first\"}],\" 전략을 사용하고 있는 경우 Service Worker의 캐싱 \",[\"$\",\"strong\",null,{\"children\":\"SWAP\"}],\"이 완료되는 시점 전후로 요청되는 리소스에 대해\\r\\nold 캐시와 new 캐시가 혼합되어 서빙될 수 있는 구조적인 문제 발생 (계속되는 서비스 증가로 인해 swap 완료 시점이 늘어남)\"]}],\"\\n\",[\"$\",\"hr\",null,{}],\"\\n\",[\"$\
